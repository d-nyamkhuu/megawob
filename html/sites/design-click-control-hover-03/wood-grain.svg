<svg xmlns="http://www.w3.org/2000/svg" width="768" height="256" viewBox="0 0 768 256">
<defs>
<filter id="grain" x="0" y="0" width="100%" height="100%">
<feTurbulence type="fractalNoise" baseFrequency=".024 .34" numOctaves="4" seed="14" stitchTiles="stitch"/>
<feColorMatrix type="saturate" values="0"/>
<feComponentTransfer><feFuncR type="gamma" amplitude="1" exponent="2.1" offset="0"/><feFuncG type="gamma" amplitude="1" exponent="2.1" offset="0"/><feFuncB type="gamma" amplitude="1" exponent="2.1" offset="0"/></feComponentTransfer>
<feColorMatrix values=".32 0 0 0 .035  .23 0 0 0 .02  .15 0 0 0 .015  0 0 0 1 0"/>
</filter>
<filter id="fine" x="0" y="0" width="100%" height="100%">
<feTurbulence type="fractalNoise" baseFrequency=".025 .58" numOctaves="2" seed="8" stitchTiles="stitch"/>
<feColorMatrix type="saturate" values="0"/>
<feColorMatrix values=".4 0 0 0 0  .25 0 0 0 0  .12 0 0 0 0  0 0 0 .25 0"/>
</filter>
</defs>
<rect width="768" height="256" fill="#261d16"/>
