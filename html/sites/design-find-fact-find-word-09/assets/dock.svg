 <linearGradient id="fade" x2="0" y2="1"><stop stop-color="white" stop-opacity=".22"/><stop offset="1" stop-color="white" stop-opacity="0"/></linearGradient>
 <mask id="reflection"><path d="M0 94h1104v36H0Z" fill="url(#fade)"/></mask>
</defs>
<rect x="46" y="0" width="1018" height="120" rx="18" fill="#d3e8f2" fill-opacity=".27" stroke="#d1edfa" stroke-opacity=".4"/>
