<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1104 134">
<defs>
 <linearGradient id="silver" x2=".2" y2="1"><stop stop-color="#fff"/><stop offset=".45" stop-color="#e7eef4"/><stop offset="1" stop-color="#a4b5c9"/></linearGradient>
 <linearGradient id="blue" x2=".6" y2="1"><stop stop-color="#65d5ff"/><stop offset=".5" stop-color="#258ef0"/><stop offset="1" stop-color="#084bc0"/></linearGradient>
 <linearGradient id="gold" x2="1" y2="1"><stop stop-color="#e9dda8"/><stop offset="1" stop-color="#9b8550"/></linearGradient>
 <linearGradient id="red" x2="0" y2="1"><stop stop-color="#e66458"/><stop offset="1" stop-color="#972a29"/></linearGradient>
